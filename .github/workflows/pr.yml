# Written by `pubkit sync` from the ci block of pubkit.json. Do not edit:
# change pubkit.json and run `pubkit sync`.
name: pr

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  checks:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-service-checks.yml@01c2711869ce046ec875edee83e575b955cfbabf # v0.31.3
    with: {"shellcheck": "with-secrets k8s/admin/e2e.sh"}

  tests:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-service-tests.yml@01c2711869ce046ec875edee83e575b955cfbabf # v0.31.3
    with: {"setup": "make venv", "test": "make functional"}

  sonar:
    name: ci
    needs: [tests]
    uses: Sustenaut/pubkit/.github/workflows/job-sonar.yml@01c2711869ce046ec875edee83e575b955cfbabf # v0.31.3
    with: {"sonar-args": "-Dsonar.sources=src,k8s,Dockerfile -Dsonar.tests=tests", "reports": "sonar.python.coverage.reportPaths=*.xml sonar.javascript.lcov.reportPaths=lcov.info"}
    secrets: { SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}' }

  # The one check a ruleset requires: it passes only when every job
  # above succeeded. None of them is ever skipped for not being asked for.
  passed:
    name: ci / passed
    if: always()
    needs: [checks, tests, sonar]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
        env: { RESULTS: '${{ toJSON(needs) }}' }
