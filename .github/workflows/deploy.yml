# Builds the notifier's image once CI passes on a merge to main, and sends k8s/ to the shared k3s
# server over SSH and the tailnet, with pubkit's k8s-deploy.yml (pubkit's README,
# "Deploying a service to k3s"), where the deploy key can only run sustenaut-deploy.
#
# Where signals go is the repository variable NOTIFIER_ROUTES, which pubkit.json
# declares and the owner's state repository keeps, so nothing here names a channel or
# a consumer. It deploys only once DEPLOY_NOTIFIER is "on", which the deploy walk sets
# once every need before it is ready.
name: deploy

on:
  # Once CI (main.yml) has passed on a merge to main, never beside it; k8s-deploy's
  # ready job also waits for the integrations check on that commit.
  workflow_run: { workflows: [main], types: [completed], branches: [main] }
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  deploy:
    uses: Sustenaut/pubdeploy/.github/workflows/k8s-deploy.yml@2df756eb5916723abb2d9fac9e3fd58e67693877 # v0.2.0
    with:
      image: ghcr.io/sustenaut/notifier
      deploys: k8s notifier DEPLOY_NOTIFIER
      # It starts as its own user, has its dependencies, and refuses to run without
      # its settings.
      check: |
        docker run --rm "$IMAGE" sh -c 'test "$(id -u)" = 1000'
        docker run --rm "$IMAGE" python -c 'import integrations.clients.slack, integrations.storage_sink, observability.links, observability.bigquery, notifier.notify'
        test "$(docker run --rm "$IMAGE" notifier run >/dev/null 2>&1; echo $?)" = 2
      render: |
        var() { jq -r --arg name "$1" '.[$name] // ""' <<<"$VARS"; }
        kustomize edit add configmap notifier-settings \
          --from-literal="NOTIFIER_ROUTES=$(var NOTIFIER_ROUTES)"
    secrets: inherit
